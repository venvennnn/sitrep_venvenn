# One-click deploy to Render. Push this repo to GitHub, then
# "New > Blueprint" on render.com and point it here. Set SITREP_AGENT_SECRET
# and LLM_API_KEY in the Render dashboard. Attach a disk and set
# DRIFTGUARD_DB_PATH for durable glossary memory.
services:
  - type: web
    name: driftguard-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SITREP_AGENT_SECRET
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: MODEL
        # Free-model slugs on OpenRouter change often. Prefer openrouter/free
        # (auto-routes) or check https://openrouter.ai/models?q=free
        value: openrouter/free
      - key: DRIFTGUARD_WORKSPACE
        value: default
